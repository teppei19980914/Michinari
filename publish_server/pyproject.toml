[project]
name = "michinari-publish-server"
version = "0.1.0"
description = "ミチナリ Web公開サービス（publish_server）。backendとは別プロセス・別DB（開発Todo_Web公開_v1.0 D-12・D-23）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # psycopg(v3)。接続URLは postgresql+psycopg://（SQLAlchemy 2.0公式ドキュメントで確認済み、
    # https://docs.sqlalchemy.org/en/20/dialects/postgresql.html）。binary extraはビルド
    # ツール不要で導入できるため公式推奨（https://www.psycopg.org/psycopg3/docs/basic/install.html）。
    "psycopg[binary]>=3.2",
    # パスワードハッシュ化（D-17）。既定でArgon2idを使用（argon2-cffi公式ドキュメントで確認済み、
    # https://argon2-cffi.readthedocs.io/en/stable/api.html ）。
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# backend/pyproject.tomlと同じ理由（FastAPI公式のDIパターン、ruff/FastAPI公式ドキュメント推奨設定）。
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "pragma: no branch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# backend/pyproject.tomlと同じ理由（OneDrive同期フォルダ内でのハードリンク失敗を回避、
# OPERATIONS.md 7.4参照）。
link-mode = "copy"
