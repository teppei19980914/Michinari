[project]
name = "michinari-backend"
version = "1.0.0"
description = "ミチナリ バックエンド"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "newtonx-adk",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyinstaller>=6.22.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI公式のDIパターン（Depends(...)を引数既定値にする）はB008の意図する
# 「可変な既定値」の落とし穴に該当しないため許可する（ruff/FastAPI公式ドキュメント推奨設定）。
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Alembic自動生成ファイルはツール生成物のため対象外とする
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing"
# scripts/ 配下（build_package.py・publish_release.py）はパッケージ化されていないため、
# テストからimportできるようpytestにパスを追加する（各テストファイルでの
# sys.path.insert の重複を避けるため、CODING_RULES.md DRYの原則によりここへ集約）。
pythonpath = ["scripts"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "pragma: no branch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# uvは既定でグローバルキャッシュから.venv・ビルド環境へハードリンクを張るが、本リポジトリの
# 環境ではキャッシュ配下のファイルがOneDriveのクラウドファイル（リパースポイント）化しており、
# ハードリンクが `os error 396`（クラウド操作は、互換性のないハードリンクのファイルでは
# 実行できません）で失敗して `uv sync` がビルド依存（hatchling→pluggy）の導入に失敗する。
# コピーへ切り替えることでこの失敗を回避する（uv公式のエラーメッセージが案内する対処
# `--link-mode=copy` / `UV_LINK_MODE=copy` と同じ設定。OPERATIONS.md 7.4参照）。
link-mode = "copy"

[tool.uv.sources]
newtonx-adk = { path = "../newtonx_adk/newtonx_adk-0.10.5-py3-none-any.whl" }
